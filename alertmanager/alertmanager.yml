# Alertmanager does not expand shell/env variables inside this file, so the
# secret fields below are read from files instead (`*_file`), mounted by
# docker-compose from ./alertmanager/secrets/*. See alertmanager/README.md for
# how to populate those files (Slack webhook, SMTP credentials, PagerDuty key)
# before deploying this stack.

global:
  resolve_timeout: 5m
  slack_api_url_file: /etc/alertmanager/secrets/slack_webhook_url
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alerts@lumina.dev'
  smtp_auth_username_file: /etc/alertmanager/secrets/smtp_user
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp_password

# Alerts are grouped by alertname + service so a single incident (e.g. many
# instances of HighErrorRate for the same service) produces one notification
# instead of one per firing series.
route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: slack-default

  routes:
    # Critical alerts page on-call via PagerDuty in addition to Slack.
    - match:
        severity: critical
      receiver: pagerduty-critical
      continue: true

    - match:
        severity: critical
      receiver: slack-critical
      group_wait: 10s
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: slack-default

inhibit_rules:
  # Don't page for latency/error-rate noise on a service that's already down.
  - source_matchers: ['alertname = ServiceDown']
    target_matchers: ['alertname =~ HighErrorRate|HighLatency']
    equal: ['service']

receivers:
  - name: slack-default
    slack_configs:
      - channel: '#lumina-alerts'
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'

  - name: slack-critical
    slack_configs:
      - channel: '#lumina-incidents'
        send_resolved: true
        title: ':rotating_light: {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty_routing_key
        description: '{{ .CommonAnnotations.summary }}'
        severity: critical

  - name: email-default
    email_configs:
      - to: 'oncall@lumina.dev'
        send_resolved: true
