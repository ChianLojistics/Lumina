apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: lumina-primary
spec:
  schedule: "0 */4 * * *"  # Every 4 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: postgres:15-alpine
            command:
            - /bin/bash
            - -c
            - |
              set -e
              
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_FILE="lumina_backup_${TIMESTAMP}.sql.gz"
              S3_BUCKET="s3://lumina-backups/postgres"
              
              echo "Starting backup at ${TIMESTAMP}"
              
              # Perform backup
              PGPASSWORD=$POSTGRES_PASSWORD pg_dump \
                -h postgres-master \
                -U lumina \
                -d lumina \
                -F c \
                -f /tmp/${BACKUP_FILE}
              
              # Compress backup
              gzip /tmp/${BACKUP_FILE}
              
              # Upload to S3
              aws s3 cp /tmp/${BACKUP_FILE}.gz ${S3_BUCKET}/${BACKUP_FILE}.gz \
                --storage-class STANDARD_IA \
                --metadata "region=primary,timestamp=${TIMESTAMP}"
              
              # Clean up old backups (keep last 30 days)
              aws s3 ls ${S3_BUCKET}/ | while read -r line; do
                FILE_DATE=$(echo $line | awk '{print $1" "$2}')
                FILE_AGE=$(( ($(date +%s) - $(date -d "$FILE_DATE" +%s)) / 86400 ))
                if [ $FILE_AGE -gt 30 ]; then
                  FILE_NAME=$(echo $line | awk '{print $4}')
                  aws s3 rm ${S3_BUCKET}/${FILE_NAME}
                fi
              done
              
              echo "Backup completed successfully"
              
            env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: secret-access-key
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            volumeMounts:
            - name: backup-temp
              mountPath: /tmp
          volumes:
          - name: backup-temp
            emptyDir: {}
          restartPolicy: OnFailure
          backoffLimit: 3
